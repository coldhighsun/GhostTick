name: CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Debug
      - run: dotnet test --no-build -c Debug

  publish:
    name: Pack & Publish to NuGet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      id-token: write # Required for NuGet trusted publishing (OIDC); without it NuGet/login fails with 403
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - run: dotnet pack src/GhostTick/GhostTick.csproj -c Release -o ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not email

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # Required to create the release

    steps:
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A SemVer pre-release tag contains a hyphen (e.g. v1.2.3-beta.1, v1.2.3-rc.1)
          if [[ "$TAG" == *-* ]]; then
            channel_flag="--prerelease"
          else
            channel_flag="--latest"
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-run of the workflow: keep the existing release, just fix its channel
            gh release edit "$TAG" $channel_flag
          else
            gh release create "$TAG" --verify-tag --title "GhostTick $TAG" --generate-notes $channel_flag
          fi